[project]
name = "trading-strategy"
version = "0.1.0"
description = "ETL and strategy engine for Nasdaq and S&P 500 trading"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.50",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "fastmcp>=2.0.0,<2.14",
    "tradingview-ta>=3.3.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl", "indicators", "strategies", "backtest", "mcp_server"]

[project.scripts]
trading-fetch = "etl.pipeline:cli"
trading-backtest = "backtest.engine:cli"
trading-mcp = "mcp_server.server:main"

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
    "ipykernel>=6.0.0",
    "seaborn>=0.13.0",
]
